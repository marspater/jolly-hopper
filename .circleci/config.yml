version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:24.0
    resource_class: medium

  macos-executor:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium

jobs:
  scripting:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Verify Node.js runtime
          command: |
            set -euo pipefail
            node --version
            node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 24) { throw new Error("Node.js 24+ is required"); }'
      - run:
          name: Check JavaScript syntax
          command: |
            set -euo pipefail
            for file in \
              SiphonExtension_Chrome/background.js \
              SiphonExtension_Firefox/background.js \
              SiphonExtension_Safari/background.js \
              server/index.js \
              server/test/server.test.js \
              scripts/capture_original_mp4.js \
              scripts/test_capture_original_mp4.js \
              scripts/run_suite.js \
              scripts/test_run_suite.js \
              scripts/verify_deployment.js \
              scripts/test_verify_deployment.js
            do
              node --check "$file"
            done
      - run:
          name: Verify hardened runtime entitlements
          command: |
            set -euo pipefail
            if grep -qE 'com\.apple\.security\.cs\.(allow-unsigned-executable-memory|disable-library-validation)' Siphon/Siphon.entitlements; then
              echo "Dangerous Hardened Runtime exception reintroduced." >&2
              exit 1
            fi
      - run:
          name: Verify extension credential boundary
          command: |
            set -euo pipefail
            for file in \
              SiphonExtension_Chrome/background.js \
              SiphonExtension_Firefox/background.js \
              SiphonExtension_Safari/background.js
            do
              if grep -Eq '([?&]cookies=|getCookiesForUrl|(chrome|browser)\.cookies)' "$file"; then
                echo "Browser credential material must not enter extension deep-link transport: $file" >&2
                exit 1
              fi
            done
            if grep -Eq '"cookies"|host_permissions' SiphonExtension_Chrome/manifest.json; then
              echo "Chrome extension must not request cookie/all-host access for Siphon handoff." >&2
              exit 1
            fi
      - run:
          name: Run testsuite with Smarter Testing
          command: circleci testsuite run "scripts"
      - run:
          name: Check shell script syntax
          command: |
            set -euo pipefail
            for script in scripts/verify_bundle.sh scripts/build_and_run.sh scripts/fetch_pinned_ffmpeg.sh; do
              bash -n "$script"
            done

  xcode-test:
    executor: macos-executor
    steps:
      - checkout
      - run:
          name: Verify Siphon bundle and version consistency
          command: bash scripts/verify_bundle.sh
      - run:
          name: Test (Debug)
          no_output_timeout: 30m
          command: |
            xcodebuild test \
              -project Siphon.xcodeproj \
              -scheme Siphon \
              -destination 'platform=macOS' \
              -configuration Debug \
              MACOSX_DEPLOYMENT_TARGET=15.0 \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
      - run:
          name: Test (Release)
          when: always
          no_output_timeout: 30m
          command: |
            xcodebuild test \
              -project Siphon.xcodeproj \
              -scheme Siphon \
              -destination 'platform=macOS' \
              -configuration Release \
              MACOSX_DEPLOYMENT_TARGET=15.0 \
              ENABLE_TESTABILITY=YES \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO

  conversion-test:
    executor: macos-executor
    steps:
      - checkout
      - run:
          name: Fetch pinned FFmpeg
          command: |
            mkdir -p /tmp/ffmpeg
            scripts/fetch_pinned_ffmpeg.sh /tmp/ffmpeg
      - run:
          name: Test conversions with real FFmpeg (Debug)
          no_output_timeout: 30m
          environment:
            TEST_RUNNER_SIPHON_CONVERSION_FFMPEG_DIR: /tmp/ffmpeg
          command: |
            set -o pipefail
            touch /tmp/conversion.log
            xcodebuild test \
              -project Siphon.xcodeproj \
              -scheme Siphon \
              -destination 'platform=macOS' \
              -configuration Debug \
              -only-testing:SiphonTests/YtdlpServiceTests/testCodecConversionsProduceRequestedCodecWithRealFFmpeg \
              -only-testing:SiphonTests/YtdlpServiceTests/testHDRToSDRToneMappingKeepsBrightnessWithRealFFmpeg \
              -only-testing:SiphonTests/YtdlpServiceTests/testManagedFFmpegVerifiesHTTPSWithSanitizedEnvironment \
              MACOSX_DEPLOYMENT_TARGET=15.0 \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO | tee /tmp/conversion.log

            if grep -q "' skipped (" /tmp/conversion.log; then
              echo "Error: Real-FFmpeg conversion tests were skipped" >&2
              exit 1
            fi
      - store_artifacts:
          path: /tmp/conversion.log
          destination: logs/conversion.log

  deploy-companion:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Determine target version
          command: |
            set -euo pipefail
            APP_VERSION=$(node -p "require('./server/package.json').version || '1.0.0'")
            REVISION="${CIRCLE_SHA1:-unknown}"
            echo "export APP_VERSION=\"${APP_VERSION}-${REVISION:0:7}\"" >> "$BASH_ENV"
      - run:
          name: Plan deployment
          command: |
            circleci run release plan siphon-companion \
              --environment-name="production" \
              --component-name="siphon-companion" \
              --target-version="${APP_VERSION}"
      - run:
          name: Deploy companion service
          command: |
            set -euo pipefail
            echo "Deploying Siphon companion service to Render (production)..."
            if [ -n "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
              echo "Triggering Render deploy via deploy hook..."
              curl --fail --silent --show-error --location --request POST "${RENDER_DEPLOY_HOOK_URL}"
            else
              echo "RENDER_DEPLOY_HOOK_URL not configured; relying on automated GitHub push deployment."
            fi

            node scripts/verify_deployment.js https://jolly-hopper.onrender.com/healthz \
              --commit "${CIRCLE_SHA1:-}" \
              --version "${APP_VERSION:-}" \
              --timeout 180 \
              --interval 10
      - run:
          name: Update deployment status to running
          command: circleci run release update siphon-companion --status=RUNNING
      - run:
          name: Update deployment status to failed
          command: circleci run release update siphon-companion --status=FAILED
          when: on_fail

  release-companion:
    type: release
    plan_name: siphon-companion
    validation:
      enabled: true
      webhooks:
        - name: alerts
          provider: alertmanager

workflows:
  test-and-verify:
    jobs:
      - scripting
      - xcode-test
      - conversion-test
      - deploy-companion:
          requires:
            - scripting
          filters:
            branches:
              only: main
      - release-companion:
          requires:
            - deploy-companion
          filters:
            branches:
              only: main
