version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:24.0
    resource_class: medium

jobs:
  deploy-companion:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Determine target version
          command: |
            set -euo pipefail
            APP_VERSION=$(node -p "require('./server/package.json').version || '1.0.0'")
            # Render deploys from rootDir server/, so pushes that leave it untouched
            # keep serving the last commit that changed it.
            SERVER_REVISION=$(git log -1 --format=%H -- server)
            if [ -z "$SERVER_REVISION" ]; then
              echo "Could not resolve the last server/ commit (shallow checkout?)" >&2
              exit 1
            fi
            echo "export SERVER_REVISION=\"${SERVER_REVISION}\"" >> "$BASH_ENV"
            echo "export APP_VERSION=\"${APP_VERSION}-${SERVER_REVISION:0:7}\"" >> "$BASH_ENV"
      - run:
          name: Plan deployment
          command: |
            circleci run release plan siphon-companion \
              --environment-name="production" \
              --component-name="siphon-companion" \
              --target-version="${APP_VERSION}"
      - run:
          name: Deploy companion service
          command: |
            set -euo pipefail
            echo "Deploying Siphon companion service to Render (production)..."
            if [ -n "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
              echo "Triggering Render deploy via deploy hook..."
              curl --fail --silent --show-error --location --request POST "${RENDER_DEPLOY_HOOK_URL}"
            else
              echo "RENDER_DEPLOY_HOOK_URL not configured; relying on automated GitHub push deployment."
            fi

            node scripts/verify_deployment.js https://jolly-hopper.onrender.com/healthz \
              --commit "${SERVER_REVISION}" \
              --version "${APP_VERSION}" \
              --timeout 180 \
              --interval 10
      - run:
          name: Update deployment status to running
          command: circleci run release update siphon-companion --status=RUNNING
      - run:
          name: Update deployment status to failed
          command: circleci run release update siphon-companion --status=FAILED
          when: on_fail

  release-companion:
    type: release
    plan_name: siphon-companion
    validation:
      enabled: true
      webhooks:
        - name: alerts
          provider: alertmanager

workflows:
  # Tests run in GitHub Actions; CircleCI only deploys the companion service.
  deploy:
    jobs:
      - deploy-companion:
          filters:
            branches:
              only: main
      - release-companion:
          requires:
            - deploy-companion
          filters:
            branches:
              only: main
