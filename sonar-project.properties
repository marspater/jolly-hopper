sonar.projectKey=marspater_jolly-hopper
sonar.organization=marspater
sonar.projectName=jolly-hopper

# Source and Test directories
sonar.sources=Siphon,SiphonExtension_Chrome,SiphonExtension_Firefox,SiphonExtension_Safari,server,scripts
sonar.tests=SiphonTests

# Language specific settings
sonar.swift.project=Siphon.xcodeproj
sonar.swift.appScheme=Siphon

# Exclusions
sonar.exclusions=build/**,assets/**,scripts/test_*.js,server/test/**
# Each browser extension is loaded as its own self-contained package and cannot
# import a script from outside its folder, so their background scripts repeat the
# same helpers by necessity. Keep them out of duplication detection only.
sonar.cpd.exclusions=SiphonExtension_Chrome/**,SiphonExtension_Firefox/**,SiphonExtension_Safari/**
