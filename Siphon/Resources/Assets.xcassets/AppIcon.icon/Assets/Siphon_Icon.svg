<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- macOS Icon Squircle Clip Path -->
    <clipPath id="squircleClip">
      <path d="M 128,32 H 384 C 454.8,32 480,57.2 480,128 V 384 C 480,454.8 454.8,480 384,480 H 128 C 57.2,480 32,454.8 32,384 V 128 C 32,57.2 57.2,32 128,32 Z"/>
    </clipPath>

    <!-- Main Background Cosmic Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="85%" stop-color="#1E1035"/>
      <stop offset="100%" stop-color="#0A0518"/>
    </linearGradient>

    <!-- Ambient Glow Background Radial -->
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Primary Glyph Electric Gradient (Luma V/X Down Arrow) -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Highlight Specular Gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>

    <!-- Secondary Accent Gradient (Speed Trails & Wings) -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Rim Border Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Top Glass Reflection Overlay -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Drop Shadow Filter for Glyph -->
    <filter id="glyphShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3B82F6" flood-opacity="0.4"/>
    </filter>

    <!-- Squircle Shadow -->
    <filter id="squircleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Group clipped to macOS Squircle Geometry -->
  <g filter="url(#squircleShadow)">
    <!-- Base Squircle Surface -->
    <path d="M 128,32 H 384 C 454.8,32 480,57.2 480,128 V 384 C 480,454.8 454.8,480 384,480 H 128 C 57.2,480 32,454.8 32,384 V 128 C 32,57.2 57.2,32 128,32 Z" fill="url(#bgGrad)"/>
    
    <!-- Clipped Internal Layers -->
    <g clip-path="url(#squircleClip)">
      <!-- Ambient Radial Backlight -->
      <rect x="32" y="32" width="448" height="448" fill="url(#ambientGlow)"/>

      <!-- Cosmic Grid Lines / Speed Wave Sub-structure -->
      <g opacity="0.08" stroke="#FFFFFF" stroke-width="1.5" fill="none">
        <circle cx="256" cy="256" r="140"/>
        <circle cx="256" cy="256" r="210"/>
        <line x1="32" y1="256" x2="480" y2="256"/>
        <line x1="256" y1="32" x2="256" y2="480"/>
      </g>

      <!-- Background Speed Accent Rings -->
      <path d="M 110,180 A 180,180 0 0,1 402,180" fill="none" stroke="url(#wingGrad)" stroke-width="3" opacity="0.4" stroke-dasharray="12 8" stroke-linecap="round"/>
      <path d="M 140,340 A 160,160 0 0,0 372,340" fill="none" stroke="url(#wingGrad)" stroke-width="3" opacity="0.3" stroke-dasharray="8 6" stroke-linecap="round"/>

      <!-- ==================== MAIN LUMA GLYPH ==================== -->
      <g filter="url(#glyphShadow)">
        <!-- Outer Wing Left (Sleek Speed Fin) -->
        <path d="M 104,136 L 184,136 L 224,240 L 172,240 Z" fill="url(#wingGrad)" opacity="0.85"/>
        
        <!-- Outer Wing Right (Sleek Speed Fin) -->
        <path d="M 408,136 L 328,136 L 288,240 L 340,240 Z" fill="url(#wingGrad)" opacity="0.85"/>

        <!-- Intersecting "X" Diagonal Speed Strokes -->
        <path d="M 140,150 L 372,350 L 332,382 L 100,182 Z" fill="url(#wingGrad)" opacity="0.25"/>
        <path d="M 372,150 L 140,350 L 180,382 L 412,182 Z" fill="url(#wingGrad)" opacity="0.25"/>

        <!-- Central Layered "V" + Downward Velocity Arrow -->
        <!-- Core Chevron Body -->
        <path d="M 136,140 
                 L 256,368 
                 L 376,140 
                 L 312,140 
                 L 256,260 
                 L 200,140 Z" 
              fill="url(#glyphGrad)"/>

        <!-- Fast Downward Speed Center Arrow Shaft -->
        <path d="M 236,115 H 276 V 265 L 310,265 L 256,380 L 202,265 L 236,265 Z" 
              fill="url(#glyphGrad)" filter="url(#neonGlow)"/>

        <!-- 3D Front Facet & Specular Edge Highlight -->
        <path d="M 136,140 L 256,368 L 256,380 L 202,265 L 236,265 L 236,115 L 256,115 L 200,140 Z" 
              fill="url(#highlightGrad)" opacity="0.6"/>

        <!-- Sharp Arrowhead Core Highlight -->
        <polygon points="256,380 202,265 236,265 236,210 276,210 276,265 310,265" fill="#FFFFFF" opacity="0.95"/>
      </g>

      <!-- Glass Top Curved Shine -->
      <path d="M 32,128 C 32,57.2 57.2,32 128,32 H 384 C 454.8,32 480,57.2 480,128 V 210 C 350,260 160,260 32,210 Z" fill="url(#glassReflect)"/>
    </g>

    <!-- Precision Metallic Squircle Rim Border -->
    <path d="M 128,32 H 384 C 454.8,32 480,57.2 480,128 V 384 C 480,454.8 454.8,480 384,480 H 128 C 57.2,480 32,454.8 32,384 V 128 C 32,57.2 57.2,32 128,32 Z" 
          fill="none" stroke="url(#rimGrad)" stroke-width="2.5"/>
  </g>
</svg>
