name: Apply BoyfriendTV request identity fix

on:
  push:
    branches:
      - fix/boyfriendtv-request-identity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/boyfriendtv-request-identity
          fetch-depth: 0

      - name: Apply scoped source patch
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path("Siphon/Services/Download/YtdlpService.swift")
          text = path.read_text()

          safari_pattern = re.compile(
              r'(?ms)^        let isSafari: Bool = \{\n.*?^        \}\(\)\n\n(?=        if !isYouTube \{)'
          )
          safari_replacement = "\n".join([
              "        let isSafari: Bool = {",
              "            if let idx = args.firstIndex(of: \"--cookies-from-browser\"), idx + 1 < args.count {",
              "                return args[idx + 1] == \"safari\"",
              "            }",
              "            // Explicit cookie files may come from the browser extension and do not",
              "            // imply Safari merely because Safari is the configured browser source.",
              "            if args.contains(\"--cookies\") {",
              "                return false",
              "            }",
              "            return configuredBrowserCookieSource() == \"safari\"",
              "        }()",
              "",
          ])
          text, safari_count = safari_pattern.subn(safari_replacement, text, count=1)
          if safari_count != 1:
              raise SystemExit(f"Expected one Safari identity block, found {safari_count}")

          main_pattern = re.compile(
              r'(?m)^(?P<i>\s*)request\.setValue\("https://www\.boyfriend\.tv/", forHTTPHeaderField: "Referer"\)\n(?P=i)request\.setValue\("https://www\.boyfriend\.tv", forHTTPHeaderField: "Origin"\)$'
          )
          def main_replacement(match):
              i = match.group("i")
              return "\n".join([
                  i + 'let pageBaseDomain = pageURL.host?.lowercased().contains("boyfriendtv.com") == true',
                  i + '    ? "https://www.boyfriendtv.com"',
                  i + '    : "https://www.boyfriend.tv"',
                  i + 'request.setValue(pageBaseDomain + "/", forHTTPHeaderField: "Referer")',
                  i + 'request.setValue(pageBaseDomain, forHTTPHeaderField: "Origin")',
              ])
          text, main_count = main_pattern.subn(main_replacement, text, count=1)
          if main_count != 1:
              raise SystemExit(f"Expected one BoyfriendTV main fallback header pair, found {main_count}")

          embed_pattern = re.compile(
              r'(?m)^(?P<i>\s*)embedRequest\.setValue\("https://www\.boyfriend\.tv/", forHTTPHeaderField: "Referer"\)\n(?P=i)embedRequest\.setValue\("https://www\.boyfriend\.tv", forHTTPHeaderField: "Origin"\)$'
          )
          def embed_replacement(match):
              i = match.group("i")
              return "\n".join([
                  i + 'let embedBaseDomain = embedPageURL.host?.lowercased().contains("boyfriendtv.com") == true',
                  i + '    ? "https://www.boyfriendtv.com"',
                  i + '    : "https://www.boyfriend.tv"',
                  i + 'embedRequest.setValue(embedBaseDomain + "/", forHTTPHeaderField: "Referer")',
                  i + 'embedRequest.setValue(embedBaseDomain, forHTTPHeaderField: "Origin")',
              ])
          text, embed_count = embed_pattern.subn(embed_replacement, text, count=1)
          if embed_count != 1:
              raise SystemExit(f"Expected one BoyfriendTV embed fallback header pair, found {embed_count}")

          path.write_text(text)

      - name: Commit source fix and remove patch workflow
        shell: bash
        run: |
          rm .github/workflows/patch-boyfriendtv-request-identity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Siphon/Services/Download/YtdlpService.swift .github/workflows/patch-boyfriendtv-request-identity.yml
          git commit -m "fix(boyfriendtv): preserve request identity and origin"
          git push origin HEAD:fix/boyfriendtv-request-identity
