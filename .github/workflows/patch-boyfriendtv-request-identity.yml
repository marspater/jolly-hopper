name: Apply BoyfriendTV request identity fix

on:
  push:
    branches:
      - fix/boyfriendtv-request-identity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/boyfriendtv-request-identity
          fetch-depth: 0

      - name: Apply scoped source patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("Siphon/Services/Download/YtdlpService.swift")
          text = path.read_text()

          safari_start = '        let isSafari: Bool = {\n'
          safari_end = '        }()\n\n        if !isYouTube {'
          if text.count(safari_start) != 1 or text.count(safari_end) != 1:
              raise SystemExit("Safari identity block anchors were not unique")
          start = text.index(safari_start)
          end = text.index(safari_end, start)
          safari_block = '''        let isSafari: Bool = {
              if let idx = args.firstIndex(of: "--cookies-from-browser"), idx + 1 < args.count {
                  return args[idx + 1] == "safari"
              }
              // Explicit cookie files may come from the browser extension and do not
              // imply Safari merely because Safari is the configured browser source.
              if args.contains("--cookies") {
                  return false
              }
              return configuredBrowserCookieSource() == "safari"
          }()

          if !isYouTube {'''
          text = text[:start] + safari_block + text[end + len(safari_end):]

          main_headers = '''            request.setValue("https://www.boyfriend.tv/", forHTTPHeaderField: "Referer")
              request.setValue("https://www.boyfriend.tv", forHTTPHeaderField: "Origin")'''
          if text.count(main_headers) != 1:
              raise SystemExit(f"Expected one BoyfriendTV main fallback header pair, found {text.count(main_headers)}")
          text = text.replace(
              main_headers,
              '''            let pageBaseDomain = pageURL.host?.lowercased().contains("boyfriendtv.com") == true
                  ? "https://www.boyfriendtv.com"
                  : "https://www.boyfriend.tv"
              request.setValue(pageBaseDomain + "/", forHTTPHeaderField: "Referer")
              request.setValue(pageBaseDomain, forHTTPHeaderField: "Origin")''',
              1,
          )

          embed_headers = '''                    embedRequest.setValue("https://www.boyfriend.tv/", forHTTPHeaderField: "Referer")
              embedRequest.setValue("https://www.boyfriend.tv", forHTTPHeaderField: "Origin")'''
          if text.count(embed_headers) != 1:
              raise SystemExit(f"Expected one BoyfriendTV embed fallback header pair, found {text.count(embed_headers)}")
          text = text.replace(
              embed_headers,
              '''                    let embedBaseDomain = embedPageURL.host?.lowercased().contains("boyfriendtv.com") == true
                  ? "https://www.boyfriendtv.com"
                  : "https://www.boyfriend.tv"
              embedRequest.setValue(embedBaseDomain + "/", forHTTPHeaderField: "Referer")
              embedRequest.setValue(embedBaseDomain, forHTTPHeaderField: "Origin")''',
              1,
          )

          path.write_text(text)

      - name: Commit source fix and remove patch workflow
        shell: bash
        run: |
          rm .github/workflows/patch-boyfriendtv-request-identity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Siphon/Services/Download/YtdlpService.swift .github/workflows/patch-boyfriendtv-request-identity.yml
          git commit -m "fix(boyfriendtv): preserve request identity and origin"
          git push origin HEAD:fix/boyfriendtv-request-identity
