name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '16 18 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.language == 'swift' && 120 || 30 }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-extended,security-and-quality

    - if: matrix.language == 'swift'
      name: Build Siphon for CodeQL extraction
      run: |
        xcodebuild build \
          -project Siphon.xcodeproj \
          -scheme Siphon \
          -destination 'generic/platform=macOS' \
          -configuration Debug \
          MACOSX_DEPLOYMENT_TARGET=15.0 \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        # Keep the category stable across main and pull requests. GitHub code
        # scanning uses these categories to determine which configurations are
        # expected on every commit.
        category: "/language:${{ matrix.language }}"

  swift-tests:
    name: Test Swift (Debug + Release)
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - id: test_debug
      name: Test Siphon (Debug)
      continue-on-error: true
      run: |
        xcodebuild test \
          -project Siphon.xcodeproj \
          -scheme Siphon \
          -destination 'platform=macOS' \
          -configuration Debug \
          MACOSX_DEPLOYMENT_TARGET=15.0 \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - id: test_release
      name: Test Siphon (Release)
      continue-on-error: true
      run: |
        xcodebuild test \
          -project Siphon.xcodeproj \
          -scheme Siphon \
          -destination 'platform=macOS' \
          -configuration Release \
          MACOSX_DEPLOYMENT_TARGET=15.0 \
          ENABLE_TESTABILITY=YES \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - if: always()
      name: Enforce Swift test results
      env:
        DEBUG_OUTCOME: ${{ steps.test_debug.outcome }}
        RELEASE_OUTCOME: ${{ steps.test_release.outcome }}
      run: |
        if [[ "$DEBUG_OUTCOME" != "success" || "$RELEASE_OUTCOME" != "success" ]]; then
          echo "One or more Swift test configurations failed." >&2
          echo "Debug: $DEBUG_OUTCOME" >&2
          echo "Release: $RELEASE_OUTCOME" >&2
          exit 1
        fi
