name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '16 18 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (Swift + JavaScript/TypeScript + Python)
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Run all CodeQL languages in one job and upload one combined SARIF payload.
    # GitHub's PR "Code scanning results" check otherwise evaluates the fast
    # JavaScript/Python uploads before the slower Swift database exists and
    # reports a false "1 configuration not found" for /language:swift.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        languages: swift,javascript-typescript,python
        queries: security-extended,security-and-quality

    - name: Build Siphon for CodeQL extraction
      run: |
        xcodebuild build \
          -project Siphon.xcodeproj \
          -scheme Siphon \
          -destination 'generic/platform=macOS' \
          -configuration Debug \
          MACOSX_DEPLOYMENT_TARGET=15.0 \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Generate CodeQL SARIF
      uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        output: ${{ runner.temp }}/codeql-results
        post-processed-sarif-path: ${{ runner.temp }}/codeql-results-processed
        upload: never

    - name: Preserve language configuration IDs
      shell: bash
      run: |
        python3 - <<'PY'
        import glob
        import json
        import os

        root = os.path.join(os.environ["RUNNER_TEMP"], "codeql-results-processed")
        files = sorted(glob.glob(os.path.join(root, "*.sarif")))
        expected = {"swift", "javascript-typescript", "python"}
        found = {os.path.splitext(os.path.basename(path))[0] for path in files}

        missing = expected - found
        if missing:
            raise SystemExit(f"Missing CodeQL SARIF files: {sorted(missing)}")

        for path in files:
            language = os.path.splitext(os.path.basename(path))[0]
            if language not in expected:
                continue

            with open(path, encoding="utf-8") as handle:
                sarif = json.load(handle)

            runs = sarif.get("runs", [])
            if not runs:
                raise SystemExit(f"No SARIF runs found in {path}")

            for run in runs:
                run["automationDetails"] = {"id": f"/language:{language}/"}

            with open(path, "w", encoding="utf-8") as handle:
                json.dump(sarif, handle, separators=(",", ":"))

            print(f"Prepared {language} as /language:{language}/")
        PY

    # A directory upload is combined into one SARIF payload. The individual
    # runs retain their existing /language:<lang>/ automation IDs, matching the
    # configurations already stored on main while making the upload atomic.
    - name: Upload CodeQL results
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        sarif_file: ${{ runner.temp }}/codeql-results-processed
        wait-for-processing: true

  swift-tests:
    name: Test Swift (Debug + Release)
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - id: test_debug
      name: Test Siphon (Debug)
      continue-on-error: true
      run: |
        xcodebuild test \
          -project Siphon.xcodeproj \
          -scheme Siphon \
          -destination 'platform=macOS' \
          -configuration Debug \
          MACOSX_DEPLOYMENT_TARGET=15.0 \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - id: test_release
      name: Test Siphon (Release)
      continue-on-error: true
      run: |
        xcodebuild test \
          -project Siphon.xcodeproj \
          -scheme Siphon \
          -destination 'platform=macOS' \
          -configuration Release \
          MACOSX_DEPLOYMENT_TARGET=15.0 \
          ENABLE_TESTABILITY=YES \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - if: always()
      name: Enforce Swift test results
      env:
        DEBUG_OUTCOME: ${{ steps.test_debug.outcome }}
        RELEASE_OUTCOME: ${{ steps.test_release.outcome }}
      run: |
        if [[ "$DEBUG_OUTCOME" != "success" || "$RELEASE_OUTCOME" != "success" ]]; then
          echo "One or more Swift test configurations failed." >&2
          echo "Debug: $DEBUG_OUTCOME" >&2
          echo "Release: $RELEASE_OUTCOME" >&2
          exit 1
        fi
