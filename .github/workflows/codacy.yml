# This workflow checks out code, performs a Codacy security scan
# and integrates the results with GitHub code scanning.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '16 17 * * 1'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@d43360362776a6789b47b99ae8973510854e2d3d # master
        with:
          verbose: true
          output: results.sarif
          format: sarif
          severity-cutoff: 1
          fail-if-incomplete: false

      - name: Prepare SARIF for GitHub Code Scanning
        run: |
          python3 -c "
          import json, os
          if os.path.exists('results.sarif'):
              with open('results.sarif', 'r') as f:
                  data = json.load(f)
              os.makedirs('sarif-results', exist_ok=True)
              runs = data.get('runs', [])
              if runs:
                  for idx, run in enumerate(runs):
                      tool_name = run.get('tool', {}).get('driver', {}).get('name', f'tool_{idx}').replace('/', '_')
                      single_sarif = {
                          'version': data.get('version', '2.1.0'),
                          '\$schema': data.get('\$schema', 'https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json'),
                          'runs': [run]
                      }
                      with open(f'sarif-results/{tool_name}_{idx}.sarif', 'w') as out:
                          json.dump(single_sarif, out)
              else:
                  with open('sarif-results/empty.sarif', 'w') as out:
                      json.dump(data, out)
          "

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
        if: always()
        with:
          sarif_file: sarif-results
