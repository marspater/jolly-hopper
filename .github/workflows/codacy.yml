# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the GitHub code scanning feature.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '16 17 * * 1'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@master
        with:
          verbose: true
          output: results.sarif
          format: sarif
          severity-cutoff: 1
          fail-if-incomplete: false

      - name: Merge SARIF runs for GitHub Code Scanning
        run: |
          python3 -c "
          import json, os
          if os.path.exists('results.sarif'):
              with open('results.sarif', 'r') as f:
                  data = json.load(f)
              if 'runs' in data and len(data['runs']) > 1:
                  main_run = data['runs'][0]
                  for r in data['runs'][1:]:
                      main_run.setdefault('results', []).extend(r.get('results', []))
                  data['runs'] = [main_run]
                  with open('results.sarif', 'w') as f:
                      json.dump(data, f)
          "

      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
