# This workflow checks out code, performs a Codacy security scan
# and integrates the results with GitHub code scanning.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '16 17 * * 1'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@d43360362776a6789b47b99ae8973510854e2d3d # master
        with:
          verbose: true
          output: results.sarif
          format: sarif
          severity-cutoff: 1
          fail-if-incomplete: false

      - name: Consolidate SARIF runs for GitHub Code Scanning
        if: always()
        run: |
          python3 -c "
          import json, os
          if os.path.exists('results.sarif'):
              with open('results.sarif', 'r') as f:
                  data = json.load(f)
              
              all_results = []
              all_rules = {}
              
              for r in data.get('runs', []):
                  driver = r.get('tool', {}).get('driver', {})
                  for rule in driver.get('rules', []):
                      if 'id' in rule:
                          all_rules[rule['id']] = rule
                  for res in r.get('results', []):
                      all_results.append(res)
                      rule_id = res.get('ruleId')
                      if rule_id and rule_id not in all_rules:
                          all_rules[rule_id] = {'id': rule_id, 'shortDescription': {'text': rule_id}}
              
              single_run = {
                  'tool': {
                      'driver': {
                          'name': 'Codacy',
                          'rules': list(all_rules.values())
                      }
                  },
                  'results': all_results
              }
              
              sanitized_sarif = {
                  'version': '2.1.0',
                  '\$schema': 'https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json',
                  'runs': [single_run]
              }
              
              with open('results.sarif', 'w') as f:
                  json.dump(sanitized_sarif, f)
          "

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
        if: always()
        with:
          sarif_file: results.sarif
