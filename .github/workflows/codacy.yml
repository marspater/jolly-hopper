# This workflow checks out code, performs a Codacy security scan
# and integrates the results with GitHub Code Scanning.

name: Codacy Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "16 17 * * 1"

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read

    name: Codacy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Codacy Analysis CLI
        id: codacy
        uses: codacy/codacy-analysis-cli-action@d43360362776a6789b47b99ae8973510854e2d3d # pinned SHA
        with:
          verbose: true
          output: codacy-results.sarif
          format: sarif
          severity-cutoff: 1
          fail-if-incomplete: false

      - name: Consolidate SARIF runs for GitHub Code Scanning
        id: consolidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          INPUT="codacy-results.sarif"
          OUTPUT="codacy-results-normalized.sarif"

          if [[ ! -f "$INPUT" ]]; then
            echo "No Codacy SARIF file was produced. Skipping normalization."
            exit 0
          fi

          python3 <<'PY'
          import json
          from pathlib import Path

          input_path = Path("codacy-results.sarif")
          output_path = Path("codacy-results-normalized.sarif")

          with input_path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          all_results = []
          all_rules = {}

          for run in data.get("runs", []):
              driver = run.get("tool", {}).get("driver", {})

              for rule in driver.get("rules", []):
                  rule_id = rule.get("id")
                  if rule_id:
                      all_rules[rule_id] = rule

              for result in run.get("results", []):
                  all_results.append(result)

                  rule_id = result.get("ruleId")
                  if rule_id and rule_id not in all_rules:
                      all_rules[rule_id] = {
                          "id": rule_id,
                          "shortDescription": {
                              "text": rule_id
                          }
                      }

          normalized = {
              "version": "2.1.0",
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "runs": [
                  {
                      "tool": {
                          "driver": {
                              "name": "Codacy",
                              "rules": list(all_rules.values())
                          }
                      },
                      "results": all_results
                  }
              ]
          }

          with output_path.open("w", encoding="utf-8") as f:
              json.dump(normalized, f, indent=2)

          print(f"Original SARIF runs: {len(data.get('runs', []))}")
          print(f"Combined results: {len(all_results)}")
          print(f"Normalized SARIF: {output_path}")
          PY

      - name: Validate normalized SARIF
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "codacy-results-normalized.sarif" ]]; then
            echo "No normalized SARIF file exists."
            exit 0
          fi

          python3 <<'PY'
          import json

          with open("codacy-results-normalized.sarif", "r", encoding="utf-8") as f:
              data = json.load(f)

          runs = data.get("runs", [])

          if len(runs) > 20:
              raise SystemExit(
                  f"SARIF validation failed: {len(runs)} runs found, maximum is 20"
              )

          if len(runs) != 1:
              raise SystemExit(
                  f"SARIF normalization failed: expected exactly 1 run, got {len(runs)}"
              )

          print("SARIF structure looks valid.")
          PY

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always() && hashFiles('codacy-results-normalized.sarif') != ''
        with:
          sarif_file: codacy-results-normalized.sarif
