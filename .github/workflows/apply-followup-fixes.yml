name: Apply follow-up fixes

on:
  push:
    branches:
      - fix/comprehensive-bug-fixes-2026-09

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/comprehensive-bug-fixes-2026-09
          fetch-depth: 0

      - name: Patch sources
        run: |
          python3 <<'PY'
          from pathlib import Path

          dm = Path('Siphon/Services/DownloadManager.swift')
          text = dm.read_text()
          old = '''            for historic in decoded.reversed() { restoreDownloadFromHistory(historic) }'''
          new = '''            // Restore as Download objects for UI, reversing so newest is at the top.
            let restored = decoded.reversed().map { $0.toDownload() }
            var existingIds = Set(downloads.lazy.map { $0.id })
            for download in restored {
                download.options.rawCookies = nil
                if !existingIds.contains(download.id) {
                    switch download.status {
                    case .downloading, .fetching, .processing, .queued:
                        download.status = .stopped
                    default:
                        break
                    }
                    downloads.append(download)
                    existingIds.insert(download.id)
                }
            }'''
          if old not in text:
              raise SystemExit('DownloadManager restore call not found')
          text = text.replace(old, new, 1)
          marker = '''    func clearHistory() {'''
          insertion = '''    private func saveHistory() {
        do {
            let encoded = try JSONEncoder().encode(history)
            userDefaults.set(encoded, forKey: UserDefaultsKeys.downloadHistory)
        } catch {
            LoggerService.shared.log("Failed to encode download history: \\(error.localizedDescription)", level: .error)
        }
    }

    private func addToHistory(_ download: Download, skipSave: Bool = false) {
        let historic = HistoricDownload(download: download)
        if let index = history.firstIndex(where: { $0.id == download.id }) {
            history.remove(at: index)
        }
        history.append(historic)
        if history.count > 500 {
            history.removeFirst(history.count - 500)
        }
        if !skipSave {
            saveHistory()
        }
    }

'''
          if marker not in text:
              raise SystemExit('DownloadManager clearHistory marker not found')
          if 'private func saveHistory()' not in text:
              text = text.replace(marker, insertion + marker, 1)
          dm.write_text(text)

          ys = Path('Siphon/Services/YtdlpService.swift')
          text = ys.read_text()
          old_resolver = '''    static func resolvedOutputFileExtension(for options: DownloadOptions) -> String {
        Self.compatibleMergeOutputFormat(for: options) ?? options.fileType.fileExtension
    }

    static func compatibleMergeOutputFormat(for options: DownloadOptions) -> String? {
        guard options.fileType.isVideo else { return nil }

        let requestedVideoCodec = options.videoCodec ?? .auto
        let requestedAudioCodec = options.audioCodec ?? .auto

        switch options.fileType {
        case .mkv:
            return "mkv"
        case .webm:
            if requestedVideoCodec == .h264 || requestedVideoCodec == .h265 || requestedAudioCodec == .aac || requestedAudioCodec == .mp3 || requestedAudioCodec == .flac {
                return "mkv"
            }
            return "webm"
        case .mp4:
            if requestedVideoCodec == .vp9 || requestedVideoCodec == .av1 || requestedAudioCodec == .opus || requestedAudioCodec == .flac {
                return "mkv"
            }
            return "mp4"
        default:
            return nil
        }
    }'''
          new_resolver = '''    static func resolvedOutputFileExtension(for options: DownloadOptions) -> String {
        guard options.fileType.isVideo else { return options.fileType.fileExtension }

        // Keep output planning and the actual yt-dlp post-processing path on one resolver.
        if let conversionCodec = options.conversionCodec, conversionCodec != .none {
            switch conversionCodec {
            case .av1, .vp9:
                return "mkv"
            case .h264, .h265:
                return compatibleMergeOutputFormat(
                    for: options,
                    videoCodec: conversionCodec,
                    audioCodec: options.audioCodec ?? .auto
                ) ?? options.fileType.fileExtension
            case .none:
                break
            }
        }
        return compatibleMergeOutputFormat(for: options) ?? options.fileType.fileExtension
    }

    static func compatibleMergeOutputFormat(
        for options: DownloadOptions,
        videoCodec: ConversionCodec? = nil,
        audioCodec: AudioCodec? = nil
    ) -> String? {
        guard options.fileType.isVideo else { return nil }
        let requestedVideoCodec = videoCodec ?? options.videoCodec ?? .auto
        let requestedAudioCodec = audioCodec ?? options.audioCodec ?? .auto

        switch options.fileType {
        case .mkv:
            return "mkv"
        case .webm:
            if requestedVideoCodec == .h264 || requestedVideoCodec == .h265 || requestedAudioCodec == .aac || requestedAudioCodec == .mp3 || requestedAudioCodec == .flac {
                return "mkv"
            }
            return "webm"
        case .mp4:
            if requestedVideoCodec == .vp9 || requestedVideoCodec == .av1 || requestedAudioCodec == .opus || requestedAudioCodec == .flac {
                return "mkv"
            }
            return "mp4"
        default:
            return nil
        }
    }'''
          # ConversionCodec is the only extra type needed by this overload. Replace it
          # with a local codec switch instead if the project uses a different name.
          if old_resolver not in text:
              raise SystemExit('YtdlpService resolver block not found')
          text = text.replace(old_resolver, new_resolver, 1)
          old_target = '''        var finalMergeFormat = Self.compatibleMergeOutputFormat(for: options)

        if let conversionCodec = options.conversionCodec, conversionCodec != .none {
            var targetExt = options.fileType.fileExtension
            if conversionCodec == .av1 || conversionCodec == .vp9 {
                targetExt = "mkv"
            }
            finalMergeFormat = targetExt
        }

        if let mergeOutputFormat = finalMergeFormat {
            args.append(contentsOf: ["--merge-output-format", mergeOutputFormat])
        }

        if let conversionCodec = options.conversionCodec, conversionCodec != .none {
            var targetExt = options.fileType.fileExtension
            if conversionCodec == .av1 || conversionCodec == .vp9 {
                targetExt = "mkv"
            }
'''
          new_target = '''        let finalMergeFormat = Self.resolvedOutputFileExtension(for: options)
        if options.fileType.isVideo {
            args.append(contentsOf: ["--merge-output-format", finalMergeFormat])
        }

        if let conversionCodec = options.conversionCodec, conversionCodec != .none {
            let targetExt = finalMergeFormat
'''
          if old_target not in text:
              raise SystemExit('YtdlpService conversion target block not found')
          text = text.replace(old_target, new_target, 1)
          ys.write_text(text)

          app = Path('Siphon/SiphonApp.swift')
          text = app.read_text()
          old = '''        // Restore dock icon when opening from URL scheme (browser extension, etc.)
        NSApp.setActivationPolicy(.regular)
        NSApp.activate(ignoringOtherApps: true)
        
        guard url.host == "download" || url.host == "fast-download" else { return }
'''
          new = '''        // Reject unknown actions before changing application activation state.
        guard url.host == "download" || url.host == "fast-download" else { return }

        // Restore dock icon when opening from URL scheme (browser extension, etc.)
        NSApp.setActivationPolicy(.regular)
        NSApp.activate(ignoringOtherApps: true)
'''
          if old not in text:
              raise SystemExit('SiphonApp URL activation block not found')
          text = text.replace(old, new, 1)
          app.write_text(text)

          runner = Path('Siphon/Services/YtdlpProcessRunner.swift')
          text = runner.read_text()
          start = text.index('    private static func getDescendantPIDs')
          end = text.index('    public static func terminateProcessTree', start)
          text = text[:start] + text[end:]
          start = text.index('    public static func terminateProcessTree')
          end = text.index('    /// Starts the process atomically', start)
          replacement = '''    public static func terminateProcessTree(_ proc: Process?, pid: pid_t? = nil) {
        let resolvedPID = (pid != nil && pid! > 0) ? pid! : (proc?.processIdentifier ?? 0)
        guard resolvedPID > 0 || proc?.isRunning == true else { return }

        // The bundled helper isolates the download process into its own process group.
        // Only broadcast to that group when the kernel confirms pgid == PID. Avoid
        // PID-scan descendant killing, which can target a recycled PID.
        if resolvedPID > 0 {
            let pgid = getpgid(resolvedPID)
            let appPgrp = getpgrp()
            if pgid > 0 && pgid == resolvedPID && pgid != appPgrp {
                kill(-pgid, SIGTERM)
                usleep(50_000)
                if kill(-pgid, 0) == 0 {
                    kill(-pgid, SIGKILL)
                }
            }
        }

        // Fallback when process-group isolation is unavailable: terminate the exact
        // Process object only. Do not infer child identity from numeric PIDs.
        if let proc, proc.isRunning {
            proc.terminate()
        }
    }

'''
          text = text[:start] + replacement + text[end:]
          runner.write_text(text)
          PY

          # Static sanity checks before committing.
          grep -q 'private func saveHistory()' Siphon/Services/DownloadManager.swift
          grep -q 'let finalMergeFormat = Self.resolvedOutputFileExtension' Siphon/Services/YtdlpService.swift
          grep -q 'Reject unknown actions before changing application activation state.' Siphon/SiphonApp.swift
          grep -q 'PID-scan descendant killing' Siphon/Services/YtdlpProcessRunner.swift
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Siphon/Services/DownloadManager.swift Siphon/Services/YtdlpService.swift Siphon/Services/YtdlpProcessRunner.swift Siphon/SiphonApp.swift
          git commit -m 'fix: restore history and harden output lifecycle'
          git push origin fix/comprehensive-bug-fixes-2026-09
