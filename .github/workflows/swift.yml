name: Xcode - Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "mars/fix-audit-*" ]
  workflow_dispatch:
    inputs:
      live_playback:
        description: 'Also test public clear-HLS and FairPlay playback (requires supported DRM hardware)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Native tests (arm64, macOS 27)
    # Apple silicon only. GitHub's Xcode 27 image runs macOS 27 on arm64.
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      TEST_RUNNER_SIPHON_RUN_PLAYBACK_LIVE_TESTS: ${{ inputs.live_playback && '1' || '0' }}
      TEST_RUNNER_SIPHON_RUN_FAIRPLAY_LIVE_TESTS: ${{ inputs.live_playback && '1' || '0' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify toolchain and bundle versions
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 27
          xcodebuild -version
          xcrun swift --version
          bash scripts/verify_bundle.sh
          mkdir -p "$RUNNER_TEMP/test-results"

      - name: Test (Debug)
        run: |
          xcodebuild test \
            -project Siphon.xcodeproj \
            -scheme Siphon \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/siphon-derived" \
            -resultBundlePath "$RUNNER_TEMP/test-results/Debug.xcresult" \
            -parallel-testing-enabled NO \
            MACOSX_DEPLOYMENT_TARGET=27.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Test (Release)
        id: release
        # Run even when Debug fails, so one CI run reports both configurations.
        if: ${{ !cancelled() }}
        run: |
          xcodebuild test \
            -project Siphon.xcodeproj \
            -scheme Siphon \
            -destination 'platform=macOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/siphon-derived" \
            -resultBundlePath "$RUNNER_TEMP/test-results/Release.xcresult" \
            -parallel-testing-enabled NO \
            MACOSX_DEPLOYMENT_TARGET=27.0 \
            ENABLE_TESTABILITY=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify arm64 Release binaries
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/siphon-derived/Build/Products/Release/Siphon.app"
          for BINARY in "$APP/Contents/MacOS/Siphon" "$APP/Contents/Helpers/siphon-pgrp"; do
            test "$(lipo -archs "$BINARY")" = arm64
          done

      - name: Save XCTest reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xctest-arm64-macos-27
          path: ${{ runner.temp }}/test-results/*.xcresult
          retention-days: 7
          if-no-files-found: warn
