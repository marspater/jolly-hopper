name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to update (e.g. v4.0.0)'
        required: true
        default: 'v4.0.0'

permissions:
  contents: read

concurrency:
  group: update-homebrew-tap
  cancel-in-progress: false

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get release asset info
        id: asset
        run: |
          TAG_NAME="${{ steps.version.outputs.tag_name }}"
          ASSET_URL="https://github.com/marspater/jolly-hopper/releases/download/${TAG_NAME}/Siphon-${TAG_NAME}.dmg"
          
          curl --fail --silent --show-error --location \
            --proto '=https' \
            --proto-redir '=https' \
            --retry 4 \
            --retry-delay 3 \
            --retry-all-errors \
            "$ASSET_URL" \
            -o siphon.dmg

          if [[ ! -s siphon.dmg ]]; then
            echo "Downloaded DMG is empty." >&2
            exit 1
          fi

          SHA256=$(sha256sum siphon.dmg | cut -d' ' -f1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Checkout Homebrew Tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: marspater/homebrew-luma
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Cask formula
        run: |
          cd homebrew-tap
          if [ -f "Casks/siphon.rb" ]; then
            sed -i 's/version "[^"]*"/version "${{ steps.version.outputs.version }}"/' Casks/siphon.rb
            sed -i 's/sha256 "[^"]*"/sha256 "${{ steps.asset.outputs.sha256 }}"/' Casks/siphon.rb
            git add Casks/siphon.rb
          elif [ -f "Casks/luma-pro.rb" ]; then
            sed -i 's/version "[^"]*"/version "${{ steps.version.outputs.version }}"/' Casks/luma-pro.rb
            sed -i 's/sha256 "[^"]*"/sha256 "${{ steps.asset.outputs.sha256 }}"/' Casks/luma-pro.rb
            git add Casks/luma-pro.rb
          else
            echo "No supported Siphon cask was found in the Homebrew tap." >&2
            exit 1
          fi

      - name: Commit and push changes
        run: |
          cd homebrew-tap
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Update Siphon to v${{ steps.version.outputs.version }}"
            git push
          else
            echo "No changes to commit"
          fi
