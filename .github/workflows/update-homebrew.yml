name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to update (e.g. v4.0.0)'
        required: true
        default: 'v4.0.0'

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get release asset info
        id: asset
        run: |
          TAG_NAME="${{ steps.version.outputs.tag_name }}"
          ASSET_URL="https://github.com/marspater/jolly-hopper/releases/download/${TAG_NAME}/Luma-${TAG_NAME}.dmg"
          
          curl -sL "$ASSET_URL" -o luma.dmg
          SHA256=$(sha256sum luma.dmg | cut -d' ' -f1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Checkout Homebrew Tap
        uses: actions/checkout@v4
        with:
          repository: marspater/homebrew-luma
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Cask formula
        run: |
          cd homebrew-tap
          sed -i 's/version "[^"]*"/version "${{ steps.version.outputs.version }}"/' Casks/luma-pro.rb
          sed -i 's/sha256 "[^"]*"/sha256 "${{ steps.asset.outputs.sha256 }}"/' Casks/luma-pro.rb

      - name: Commit and push changes
        run: |
          cd homebrew-tap
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add Casks/luma-pro.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update Luma Pro to v${{ steps.version.outputs.version }}"
            git push
          else
            echo "No changes to commit"
          fi
