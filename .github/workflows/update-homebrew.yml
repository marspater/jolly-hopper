name: Update Homebrew Cask

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to update (for example vX.Y.Z)'
        required: true

permissions:
  contents: write

concurrency:
  group: update-homebrew-cask
  cancel-in-progress: false

jobs:
  update-cask:
    # ytdlp-* prereleases mirror the yt-dlp fork binary; only vX.Y.Z releases ship the app.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          # The tag lands in a URL, a sed expression and a commit message.
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected release tag: $TAG_NAME" >&2
            exit 1
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Get release asset info
        id: asset
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          set -euo pipefail
          ASSET_URL="https://github.com/marspater/jolly-hopper/releases/download/${TAG_NAME}/Siphon-${TAG_NAME}.dmg"
          
          curl --fail --silent --show-error --location \
            --proto '=https' \
            --proto-redir '=https' \
            --retry 4 \
            --retry-delay 3 \
            --retry-all-errors \
            "$ASSET_URL" \
            -o siphon.dmg

          if [[ ! -s siphon.dmg ]]; then
            echo "Downloaded DMG is empty." >&2
            exit 1
          fi

          SHA256=$(sha256sum siphon.dmg | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Update Cask formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          set -euo pipefail
          test -f Casks/siphon.rb
          sed -i "s/version \"[^\"]*\"/version \"$VERSION\"/" Casks/siphon.rb
          sed -i "s/sha256 \"[^\"]*\"/sha256 \"$SHA256\"/" Casks/siphon.rb
          git diff --check
          git add Casks/siphon.rb

      - name: Commit and push changes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          if ! git diff --cached --quiet; then
            git commit -m "chore(cask): update Siphon to v$VERSION"
            git push origin HEAD:main
          else
            echo "Cask already matches the published release"
          fi
