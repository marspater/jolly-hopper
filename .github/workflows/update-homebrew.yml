name: Update Homebrew Cask

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to update (for example vX.Y.Z)'
        required: true

permissions:
  contents: write

concurrency:
  group: update-homebrew-cask
  cancel-in-progress: false

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get release asset info
        id: asset
        run: |
          TAG_NAME="${{ steps.version.outputs.tag_name }}"
          ASSET_URL="https://github.com/marspater/jolly-hopper/releases/download/${TAG_NAME}/Siphon-${TAG_NAME}.dmg"
          
          curl --fail --silent --show-error --location \
            --proto '=https' \
            --proto-redir '=https' \
            --retry 4 \
            --retry-delay 3 \
            --retry-all-errors \
            "$ASSET_URL" \
            -o siphon.dmg

          if [[ ! -s siphon.dmg ]]; then
            echo "Downloaded DMG is empty." >&2
            exit 1
          fi

          SHA256=$(sha256sum siphon.dmg | cut -d' ' -f1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Update Cask formula
        run: |
          set -euo pipefail
          test -f Casks/siphon.rb
          sed -i 's/version "[^"]*"/version "${{ steps.version.outputs.version }}"/' Casks/siphon.rb
          sed -i 's/sha256 "[^"]*"/sha256 "${{ steps.asset.outputs.sha256 }}"/' Casks/siphon.rb
          git diff --check
          git add Casks/siphon.rb

      - name: Commit and push changes
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          if ! git diff --cached --quiet; then
            git commit -m "chore(cask): update Siphon to v${{ steps.version.outputs.version }}"
            git push origin HEAD:main
          else
            echo "Cask already matches the published release"
          fi
