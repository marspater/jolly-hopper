name: Scripting - Test and Syntax

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "mars/fix-audit-*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripting:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: server/.node-version

      - name: Verify runtimes
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 24) { throw new Error("Node.js 24+ is required"); }'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            SiphonExtension_Chrome/background.js \
            SiphonExtension_Firefox/background.js \
            SiphonExtension_Safari/background.js \
            server/index.js \
            server/test/server.test.js \
            scripts/capture_original_mp4.js \
            scripts/test_capture_original_mp4.js
          do
            node --check "$file"
          done

      - name: Verify hardened runtime entitlements
        shell: bash
        run: |
          set -euo pipefail
          if grep -qE 'com\.apple\.security\.cs\.(allow-unsigned-executable-memory|disable-library-validation)' Siphon/Siphon.entitlements; then
            echo "Dangerous Hardened Runtime exception reintroduced." >&2
            exit 1
          fi

      - name: Verify extension credential boundary
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            SiphonExtension_Chrome/background.js \
            SiphonExtension_Firefox/background.js \
            SiphonExtension_Safari/background.js
          do
            if grep -Eq '([?&]cookies=|getCookiesForUrl|(chrome|browser)\.cookies)' "$file"; then
              echo "Browser credential material must not enter extension deep-link transport: $file" >&2
              exit 1
            fi
          done
          if grep -Eq '"cookies"|host_permissions' SiphonExtension_Chrome/manifest.json; then
            echo "Chrome extension must not request cookie/all-host access for Siphon handoff." >&2
            exit 1
          fi

      - name: Test companion server
        run: npm test --prefix server

      - name: Test Chrome handoff lifecycle
        run: node --test scripts/test_chrome_handoff.js

      - name: Test native launcher shutdown ordering
        run: node --test scripts/test_build_and_run.js

      - name: Test original MP4 capture script
        run: node scripts/test_capture_original_mp4.js

      - name: Check shell script syntax
        # bash -n checks only its first file; the rest become arguments.
        run: for script in scripts/verify_bundle.sh scripts/build_and_run.sh scripts/fetch_pinned_ffmpeg.sh; do bash -n "$script"; done
