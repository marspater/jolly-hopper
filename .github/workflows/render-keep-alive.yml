name: Render Keep-Alive

on:
  schedule:
    # Asks for every 14 minutes. GitHub throttles frequent schedules (runs land
    # hours apart), so this mainly detects an unreachable service.
    - cron: '*/14 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping Render Service
        run: |
          echo "Pinging Siphon companion service on Render..."
          if ! curl --fail --silent --show-error --location \
            --proto '=https' \
            --proto-redir '=https' \
            --connect-timeout 10 \
            --max-time 90 \
            --retry 2 \
            --retry-delay 3 \
            --retry-all-errors \
            https://jolly-hopper.onrender.com/healthz; then
            # A free instance wakes in about a minute; still no answer after the
            # retries means the service is down, and the run should say so.
            echo "::error::The Render companion service did not answer /healthz."
            exit 1
          fi
