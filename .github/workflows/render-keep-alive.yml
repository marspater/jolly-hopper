name: Render Keep-Alive

on:
  schedule:
    # Run every 14 minutes to prevent Render free instance from spinning down
    - cron: '*/14 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          echo "Pinging Siphon companion service on Render..."
          if ! curl --fail --silent --show-error --location \
            --proto '=https' \
            --proto-redir '=https' \
            --connect-timeout 10 \
            --max-time 45 \
            --retry 2 \
            --retry-delay 3 \
            --retry-all-errors \
            https://jolly-hopper.onrender.com/healthz; then
            echo "::warning::Render keep-alive ping failed or the service is still warming up."
          fi
