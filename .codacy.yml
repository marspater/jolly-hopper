---
engines:
  markdownlint:
    enabled: false
  remark-lint:
    enabled: false
  duplication:
    enabled: false
  swiftlint:
    enabled: false
  tailor:
    enabled: false
  rubocop:
    enabled: false
  jshint:
    enabled: false
  pmd:
    enabled: false

exclude_paths:
  - "**.md"
  - ".jules/**"
  - ".github/**"
  - "SiphonTests/**"
  - "scripts/**"
  - "Casks/**"
  - "server/test/**"
  # Binary media fixtures; Codacy reads segment0.ts as TypeScript and crashes.
  - "server/fixtures/**"
