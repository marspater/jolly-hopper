<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Main Background Cosmic Gradient (Full Bleed) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="85%" stop-color="#1E1035"/>
      <stop offset="100%" stop-color="#0A0518"/>
    </linearGradient>

    <!-- Ambient Glow Background Radial -->
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Primary Glyph Electric Gradient (Luma V/X Down Arrow) -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Highlight Specular Gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>

    <!-- Secondary Accent Gradient (Speed Trails & Wings) -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Top Glass Reflection Overlay -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Drop Shadow Filter for Glyph -->
    <filter id="glyphShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3B82F6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full Bleed Square Surface for Native macOS Squircle Masking -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- Ambient Radial Backlight -->
  <rect x="0" y="0" width="512" height="512" fill="url(#ambientGlow)"/>

  <!-- Cosmic Grid Lines / Speed Wave Sub-structure -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1.5" fill="none">
    <circle cx="256" cy="256" r="150"/>
    <circle cx="256" cy="256" r="220"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
  </g>

  <!-- Background Speed Accent Rings -->
  <path d="M 90,170 A 200,200 0 0,1 422,170" fill="none" stroke="url(#wingGrad)" stroke-width="3" opacity="0.4" stroke-dasharray="12 8" stroke-linecap="round"/>
  <path d="M 120,350 A 180,180 0 0,0 392,350" fill="none" stroke="url(#wingGrad)" stroke-width="3" opacity="0.3" stroke-dasharray="8 6" stroke-linecap="round"/>

  <!-- ==================== MAIN LUMA GLYPH ==================== -->
  <g filter="url(#glyphShadow)">
    <!-- Outer Wing Left (Sleek Speed Fin) -->
    <path d="M 94,126 L 174,126 L 214,230 L 162,230 Z" fill="url(#wingGrad)" opacity="0.85"/>
    
    <!-- Outer Wing Right (Sleek Speed Fin) -->
    <path d="M 418,126 L 338,126 L 298,230 L 350,230 Z" fill="url(#wingGrad)" opacity="0.85"/>

    <!-- Intersecting "X" Diagonal Speed Strokes -->
    <path d="M 130,140 L 362,340 L 322,372 L 90,172 Z" fill="url(#wingGrad)" opacity="0.25"/>
    <path d="M 382,140 L 150,340 L 190,372 L 422,172 Z" fill="url(#wingGrad)" opacity="0.25"/>

    <!-- Central Layered "V" + Downward Velocity Arrow -->
    <!-- Core Chevron Body -->
    <path d="M 126,130 
             L 256,368 
             L 386,130 
             L 322,130 
             L 256,256 
             L 190,130 Z" 
          fill="url(#glyphGrad)"/>

    <!-- Fast Downward Speed Center Arrow Shaft -->
    <path d="M 236,105 H 276 V 265 L 310,265 L 256,385 L 202,265 L 236,265 Z" 
          fill="url(#glyphGrad)" filter="url(#neonGlow)"/>

    <!-- 3D Front Facet & Specular Edge Highlight -->
    <path d="M 126,130 L 256,368 L 256,385 L 202,265 L 236,265 L 236,105 L 256,105 L 190,130 Z" 
          fill="url(#highlightGrad)" opacity="0.6"/>

    <!-- Sharp Arrowhead Core Highlight -->
    <polygon points="256,385 202,265 236,265 236,210 276,210 276,265 310,265" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Glass Top Curved Shine -->
  <path d="M 0,0 H 512 V 220 C 340,270 170,270 0,220 Z" fill="url(#glassReflect)"/>
</svg>
